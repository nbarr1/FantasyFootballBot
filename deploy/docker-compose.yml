# docker compose -f deploy/docker-compose.yml up -d
#
# Then open http://127.0.0.1:8765 and sign in with MFLBOT_WEB_PASSWORD.
# The CLI still works against the same state:
#   docker compose -f deploy/docker-compose.yml exec bot bot pending
#   docker compose -f deploy/docker-compose.yml exec bot bot approve <id>
#
# One container runs both the dashboard and the scheduler, deliberately: two
# processes against one SQLite file would contend for its write lock.

services:
  bot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mflbot
    restart: unless-stopped
    working_dir: /data
    volumes:
      # Config, database, response cache and approval key all live here.
      - ./state:/data
    environment:
      # Required before anything can run.
      MFLBOT_MFL_USERNAME: "${MFLBOT_MFL_USERNAME:?set this in deploy/.env}"
      MFLBOT_MFL_PASSWORD: "${MFLBOT_MFL_PASSWORD:?set this in deploy/.env}"
      MFLBOT_MFL_API_KEY: "${MFLBOT_MFL_API_KEY:-}"
      # Set this explicitly: a container filesystem does not persist the
      # generated key, and a new key invalidates outstanding approvals.
      MFLBOT_APPROVAL_SECRET: "${MFLBOT_APPROVAL_SECRET:?set this in deploy/.env}"
      MFLBOT_WEBHOOK_URL: "${MFLBOT_WEBHOOK_URL:-}"
      # A missed check-in here is how you learn the container stopped.
      MFLBOT_HEARTBEAT_URL: "${MFLBOT_HEARTBEAT_URL:-}"
      # Signs you in to the dashboard. Required, because the container serves
      # on 0.0.0.0 and anything that reaches it could approve real MFL writes.
      MFLBOT_WEB_PASSWORD: "${MFLBOT_WEB_PASSWORD:?set this in deploy/.env}"
    ports:
      # Bound to loopback on the host: this is plain HTTP. To reach it from
      # another machine, tunnel over SSH or put a TLS proxy in front.
      - "127.0.0.1:8765:8765"
    command: ["serve", "--host", "0.0.0.0", "--with-scheduler"]
