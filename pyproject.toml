[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflbot"
version = "0.1.0"
description = "Human-in-the-loop monitoring and advisory bot for a MyFantasyLeague league"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Exact lineup optimisation. Without this the optimiser falls back to a greedy
# solver that refuses to answer when it cannot prove greedy is optimal.
solver = ["pulp>=2.8"]
# Local approval dashboard (Component 4, alternative channel).
web = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
bot = "mflbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mflbot = ["storage/*.sql", "approval/web/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
