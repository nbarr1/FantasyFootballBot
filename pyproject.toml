[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mflbot"
version = "0.1.0"
description = "Human-in-the-loop monitoring and advisory bot for a MyFantasyLeague league"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "apscheduler>=3.10",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Exact lineup optimisation. Without this the optimiser falls back to a greedy
# solver that refuses to answer when it cannot prove greedy is optimal.
solver = ["pulp>=2.8"]
# The web dashboard (`bot serve`). python-multipart is what parses the form
# posts behind every approve/reject/edit button, so it is a hard requirement
# rather than an optional nicety.
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
bot = "mflbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mflbot = [
    "storage/*.sql",
    "web/templates/*.html",
    "web/static/*",
    "templates/*.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Ruff's defaults (pycodestyle errors + pyflakes), plus a few that catch real
# mistakes rather than style preferences.
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
ignore = [
    # Long lines are left alone: several are prose in docstrings explaining a
    # safety property, and wrapping them would hurt more than it helps.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into internals deliberately (payload building, import graphs).
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "tests" is on the path so helper modules import identically under both
# `pytest` (console script, what CI runs) and `python -m pytest` (which also
# injects the CWD). Relying on the latter's implicit CWD hid a CI failure.
pythonpath = ["src", "tests"]
